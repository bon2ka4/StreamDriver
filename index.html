<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamDriver - Premium Google Drive Streaming</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="loading-screen">
        <span class="loader"></span>
        <p style="color: var(--text-dim); font-weight: 500;">Khởi tạo hệ thống...</p>
    </div>

    <div id="app">
        <header>
            <div class="logo">
                <i data-lucide="play-circle"></i>
                StreamDriver
            </div>
            <div class="user-profile">
                <div id="user-info" style="display: none; align-items: center; gap: 10px;">
                    <span id="user-name" style="font-weight: 600;"></span>
                    <img id="user-avatar" src="" style="width: 32px; height: 32px; border-radius: 50%;">
                </div>
                <button id="login-btn">Đăng nhập Drive</button>
            </div>
        </header>

        <main>
            <aside>
                <div class="nav-item active" id="nav-my-drive">
                    <i data-lucide="hard-drive"></i>
                    Drive của tôi
                </div>
                <div class="nav-item" id="nav-shared">
                    <i data-lucide="users"></i>
                    Được chia sẻ với tôi
                </div>
                <div class="nav-item" id="nav-settings">
                    <i data-lucide="settings"></i>
                    Cài đặt
                </div>
            </aside>

            <section id="content">
                <h1 class="section-title">Drive của tôi</h1>
                <div id="breadcrumb" style="display: flex; gap: 10px; color: var(--text-dim); font-size: 0.9rem;">
                    <span>Gốc</span>
                </div>
                <div class="file-grid" id="file-list">
                    <!-- Files will be injected here -->
                </div>
            </section>
        </main>

        <div id="player-modal">
            <div class="close-player" id="close-player-btn">
                <i data-lucide="x"></i>
            </div>
            <div id="player-container">
                <video id="player" playsinline controls></video>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
